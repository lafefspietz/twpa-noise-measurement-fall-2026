<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remote Experiment Server</title>
<link rel="stylesheet" href="/static/results.css">
<style>
  body { margin: 12px; background: #fff; color: #000; font: 14px/1.4 "Courier New", monospace; }
  h1 { font: bold 18px Arial, sans-serif; margin: 0 12px 0 0; display: inline; }
  button { font: inherit; border: 1px solid #000; background: #fff; padding: 2px 8px; cursor: pointer; }
  button:active { background: #000; color: #fff; }
  input, select { font: inherit; border: 1px solid #000; padding: 1px 3px; }
  input[type=number] { width: 110px; }
  .row { margin: 6px 0; }
  .muted { color: #666; }
  #plot { display: block; width: 100%; height: 420px; border: 1px solid #000; cursor: crosshair; }
  .fields label { margin-right: 14px; white-space: nowrap; display: inline-block; }
  #controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 620px), 1fr)); column-gap: 40px; }
  .control { border-top: 1px solid #000; padding: 8px 0; }
  .control .title { font-weight: bold; display: inline-block; width: 110px; }
  .param { display: inline-block; vertical-align: top; margin-right: 24px; }
  .switch { margin: 6px 0; }
  .switch .name { display: inline-block; width: 130px; }
  .switch label { margin-right: 14px; }
  .param .value { font-size: 18px; }
  .knobs { margin-top: 4px; }
  .knob { display: inline-block; text-align: center; margin-right: 10px; }
  .knob canvas { display: block; cursor: ns-resize; }
  #msg { min-height: 1.4em; font-weight: bold; overflow-wrap: anywhere; }
  #tabs { border-bottom: 1px solid #000; margin: 8px 0 10px; }
  #tabs a { display: inline-block; padding: 3px 14px; margin-bottom: -1px; color: #000; text-decoration: none;
            border: 1px solid transparent; font-weight: bold; }
  #tabs a.on { border: 1px solid #000; border-bottom-color: #fff; }
  .exp-item { display: block; border-top: 1px solid #000; padding: 8px 0; color: #000; text-decoration: none; }
  .exp-item:hover .exp-title { text-decoration: underline; }
  .exp-title { font-weight: bold; }
  #expForm fieldset { border: 1px solid #000; margin: 10px 0; padding: 4px 10px 8px; }
  #expForm legend { font-weight: bold; padding: 0 4px; }
  #expForm .f { margin: 5px 0; }
  #expForm .f > span:first-child { display: inline-block; min-width: 190px; }
  #expForm input[type=text] { width: 320px; max-width: 100%; }
  #expForm .help { color: #666; margin-left: 194px; font-size: 12px; }
  #expPlan .err { font-weight: bold; }
  #expPlan .warn { font-weight: bold; color: #555; }
  #expPlan table { border-collapse: collapse; margin-top: 6px; }
  #expPlan td, #expPlan th { border: 1px solid #000; padding: 1px 8px; text-align: right; }
  #expPlan .scroll { max-height: 320px; overflow-y: auto; display: inline-block; }
  table.segs { border-collapse: collapse; margin: 4px 0; }
  table.segs th { font-weight: normal; text-align: left; padding: 0 6px 0 0; }
  table.segs td { padding: 1px 6px 1px 0; }
  table.segs input[type=number] { width: 90px; }
  .control .note { font-weight: bold; margin-left: 10px; }
  #cfgForm fieldset { border: 1px solid #000; margin: 10px 0; padding: 4px 10px 8px; }
  #cfgForm legend { font-weight: bold; padding: 0 4px; }
  #cfgForm .group { font-weight: bold; margin: 10px 0 2px; }
  #cfgForm .f { margin: 3px 0; }
  #cfgForm .f > .name { display: inline-block; min-width: 260px; }
  #cfgForm .f.dirty > .name { font-weight: bold; }
  #cfgForm .f.dirty > .name::after { content: " *"; }
  #cfgForm input[type=number] { width: 100px; }
  #cfgForm .shelp { color: #666; font-size: 12px; margin-bottom: 4px; }
  #cfgForm .help { color: #666; font-size: 12px; margin-left: 264px; }
</style>
</head>
<body>

<div class="row">
  <h1>Remote Experiment Server</h1>
  <span id="conn">connecting...</span>
  &nbsp;<button id="allOff" title="Turn every output off (pump, signal, flux bias, VNA RF, hot wire). A running experiment stops; the server keeps running.">outputs off</button>
  <button id="quit" title="Stop the server. Instrument outputs stay as they are.">shut down server</button>
</div>
<div id="msg"></div>

<div id="tabs"><a href="#instruments" data-tab="instruments">instruments</a><a href="#experiments" data-tab="experiments">experiments</a><a href="#settings" data-tab="settings">settings</a></div>

<div id="tab-instruments">
<div class="row">
  view: <label><input type="radio" name="view" value="spa" checked> SA</label>
  <label><input type="radio" name="view" value="vna"> VNA</label>
  <span id="vnaShow" hidden>&nbsp;show: <select id="vnaQty"><option value="db">|S21| dB</option><option value="deg">phase deg</option></select></span>
  &nbsp;<button id="hold">hold</button>
  &nbsp;avg <input type="number" id="avgCount" min="1" step="1" value="1" style="width: 60px"
    title="running average over the last N traces (1 = off); restarts by itself when a setting changes">
  <button id="avgRestart" title="start the average over">restart</button>
  &nbsp;y: <label><input type="checkbox" id="autoY" checked> auto</label>
  <input type="number" id="yMin" step="any" placeholder="min"> <input type="number" id="yMax" step="any" placeholder="max">
  &nbsp;<span id="live" class="muted"></span>
</div>
<canvas id="plot"></canvas>
<div class="row">
  save: <input id="label" placeholder="label" size="16"> <input id="note" placeholder="note" size="40">
  <button id="save">save trace</button>
  &nbsp;to: <span id="dirName"></span> <button id="pickDir" hidden>choose folder</button> <button id="clearDir" hidden>use downloads</button>
  <span id="saved" class="muted"></span>
</div>

<div class="row fields" id="settings"></div>
<div class="row"><button id="apply">apply</button>
  <button id="refresh" title="Read the current values of every instrument. The page never polls them on its own; save trace also refreshes them.">refresh</button>
  <span id="refreshed" class="muted"></span></div>
<div class="row" id="alignRow">SA alignment: <span id="alignStatus" class="muted">--</span>
  <button id="alignBtn" title="Align Now, All, as on the front panel: about 3-6 min. The SA is reserved meanwhile (the live view pauses), and it can't be stopped once started. Without a cable from AMPTD REF OUT to INPUT, the RF part is skipped and only the filters (IF) are aligned.">do align</button></div>

<div id="controls"></div>
</div>

<div id="tab-experiments" hidden>
  <div id="expList"></div>
  <div id="expPage" hidden>
    <div class="row"><a href="#experiments">&larr; all experiments</a></div>
    <h2 id="expTitle" style="font: bold 16px Arial, sans-serif; margin: 8px 0 2px"></h2>
    <div id="expSummary" class="muted"></div>
    <div id="expDefNote" class="muted"></div>
    <div id="expForm"></div>
    <div class="row">
      <button id="expLoad" title="Fill the fields marked * with the values the instruments have now">load current values *</button>
      <button id="expDefaults" title="Back to the defaults: the saved ones, else the built-in ones">defaults</button>
      <button id="expSaveDefaults" title="Save this form as the defaults, for every browser (settings.local.yaml on the server)">save as defaults</button>
      <button id="expStart" disabled>start</button>
      <button id="expStop" hidden title="Stops after the trace being read; the points so far are saved">stop</button>
    </div>
    <div id="expRun" hidden>
      <div class="row"><b>result</b> <span id="runStatus"></span> <a id="runFile"></a> <a id="runHtml"
        title="One HTML file: these plots (hover for values) and every setting and instrument state of the run">download interactive HTML</a></div>
      <div id="resultView"></div>
    </div>
    <div id="expPlan"></div>
  </div>
</div>

<div id="tab-settings" hidden>
  <div class="row muted" id="cfgFile"></div>
  <div class="row"><button id="cfgSave" title="Apply the fields marked * now (Enter in a field does the same)">save</button>
    <button id="cfgDiscard" title="Show the values in use again">discard changes</button>
    <span id="cfgStatus" class="muted"></span></div>
  <div id="cfgForm"></div>
</div>

<script src="/static/results.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- API
async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {"content-type": "application/json"},
                               body: body === undefined ? undefined : JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(`${data.error || r.status}: ${data.detail || r.statusText}`);
  return data;
}
function message(text) {
  $("msg").textContent = text ? new Date().toLocaleTimeString() + "  " + text : "";
}
function fmt(v, digits) { return v === undefined || v === null || Number.isNaN(v) ? "--" : Number(v).toFixed(digits); }

// ---------------------------------------------------------------- status
async function refreshStatus() {
  if (serverStopped) return;
  try {
    const s = await api("GET", "/api/status");
    const bad = Object.entries(s.instruments).filter(([, v]) => !v.connected).map(([k]) => k);
    const running = !!s.job && jobRunning(s.job);
    experimentRunning = running;
    $("conn").textContent = (s.sim ? "[SIM] " : "") + (s.turning_off ? "turning outputs off, the experiment is stopping  |  " : "")
      + (bad.length ? "not connected: " + bad.join(", ") : "all instruments connected")
      + (running ? `  |  running: ${s.job.title} ${s.job.points_done}/${s.job.points_total}` : "");
    const al = (s.align || {}).spa;
    $("alignBtn").disabled = !!al && al.running;
    if (al && al.running) $("alignStatus").textContent = `aligning... ${al.elapsed_s} s (about 3-6 min)`;
    if (wasAligning && al && !al.running) alignDone(al);
    wasAligning = !!al && al.running;
  } catch (e) { $("conn").textContent = "server unreachable"; }
}

// ---------------------------------------------------------------- SA alignment
let wasAligning = false;
$("alignBtn").onclick = async () => {
  if (!confirm("Align the SA now (Align Now, All)?\nAbout 3-6 min. The SA is reserved and the live view pauses; "
               + "it can't be stopped once started.\n"
               + "Without the AMPTD REF OUT -> INPUT cable only the filters (IF) are aligned, not RF.")) return;
  try {
    await api("POST", "/api/spa/align");
    message("SA alignment started");
    refreshStatus();
  } catch (e) { message("alignment not started: " + e.message); }
};
function alignDone(al) {
  if (al.error) message("SA alignment failed: " + al.error);
  else {
    const r = al.result;
    message(`SA alignment done in ${Math.round(r.duration_s)} s`
      + (r.rf_skipped_no_cable ? "; RF skipped (no AMPTD REF OUT -> INPUT cable), filters aligned" : "")
      + (r.errors.length ? "; errors: " + r.errors.join(", ") : ""));
  }
  if (view === "spa") readState("spa").catch(() => {});
}

let serverStopped = false, experimentRunning = false;
async function allOutputsOff() {
  if (experimentRunning && !confirm("An experiment is running. It will stop (without its 'when done' step). Turn every output off?")) return;
  try {
    const r = await api("POST", "/api/outputs_off");
    const failed = Object.entries(r.results).filter(([, v]) => v !== "off" && v !== "not connected").map(([k, v]) => `${k}: ${v}`);
    message(failed.length ? "outputs off, except  |  " + failed.join("  |  ") : "all outputs off");
    refreshStatus();
    refreshAll();
  } catch (e) { message("outputs off failed: " + e.message); }
}
async function shutdown() {
  if (!confirm(`Stop the server? Instrument outputs stay as they are (use "outputs off" first to turn them off).
The server has to be started again on the instrument computer afterwards.`)) return;
  try {
    await api("POST", "/api/shutdown");
    serverStopped = true;
    disconnectLive();
    message("SERVER STOPPED (outputs left as they were)");
    $("conn").textContent = "server stopped";
  } catch (e) { message("shutdown failed: " + e.message); }
}
$("allOff").onclick = allOutputsOff;
$("quit").onclick = shutdown;

// ---------------------------------------------------------------- live plot
const plot = $("plot"), ctx = plot.getContext("2d");
let view = "spa", ws = null, frame = null, drawPending = false, mouse = null;

function disconnectLive() {
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
}
function connectLive(name) {
  disconnectLive();
  frame = null; requestDraw();
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/live/${name}`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "frame") { frame = m; requestDraw(); }
    else if (m.type === "status") {
      $("live").textContent = `${m.status}  ${m.fps.toFixed(1)} fps` + (frame ? `  read ${frame.read_ms} ms` : "")
        + (m.average_count > 1 ? `  avg ${m.averaged}/${m.average_count}` : "");
      if (document.activeElement !== $("avgCount")) $("avgCount").value = m.average_count;
      $("hold").textContent = m.hold ? "run" : "hold";
    } else if (m.type === "error") message(m.detail);
  };
  ws.onclose = () => setTimeout(() => { if (view === name && tab === "instruments" && !serverStopped) connectLive(name); }, 1000);
}
function requestDraw() { if (!drawPending) { drawPending = true; requestAnimationFrame(draw); } }

function series() {
  if (!frame) return null;
  let y, yLabel;
  if (frame.y_db) {
    const deg = $("vnaQty").value === "deg";
    y = deg ? frame.y_deg : frame.y_db; yLabel = deg ? "phase [deg]" : "|S21| [dB]";
  } else { y = frame.y; yLabel = frame.y_unit; }
  let x = frame.x, xLabel;
  if (frame.x_unit === "Hz") { x = x.map(v => v / 1e9); xLabel = "GHz"; }
  else { x = x.map(v => v * 1e3); xLabel = "ms"; }
  return {x, y, xLabel, yLabel};
}

function draw() {
  drawPending = false;
  const dpr = window.devicePixelRatio || 1, W = plot.clientWidth, H = plot.clientHeight;
  if (plot.width !== W * dpr || plot.height !== H * dpr) { plot.width = W * dpr; plot.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  ctx.font = "12px Courier New"; ctx.fillStyle = "#000";
  const s = series();
  if (!s) { ctx.fillText("waiting for data...", 20, 30); return; }

  const L = 80, R = 15, T = 15, B = 40, pw = W - L - R, ph = H - T - B;
  const x0 = s.x[0], x1 = s.x[s.x.length - 1] === x0 ? x0 + 1 : s.x[s.x.length - 1];
  let y0, y1;
  if ($("autoY").checked) {
    y0 = Infinity; y1 = -Infinity;
    for (const v of s.y) { if (v < y0) y0 = v; if (v > y1) y1 = v; }
    const pad = (y1 - y0) * 0.05 || Math.abs(y0) * 0.05 || 1; y0 -= pad; y1 += pad;
  } else { y0 = parseFloat($("yMin").value); y1 = parseFloat($("yMax").value); }
  const X = v => L + (v - x0) / (x1 - x0) * pw, Y = v => T + (1 - (v - y0) / (y1 - y0)) * ph;

  ctx.strokeStyle = "#ddd"; ctx.lineWidth = 1; ctx.beginPath();
  ctx.textAlign = "center";
  for (const t of ticks(x0, x1, 8)) { ctx.moveTo(X(t), T); ctx.lineTo(X(t), T + ph); ctx.fillText(label(t), X(t), T + ph + 14); }
  ctx.textAlign = "right";
  for (const t of ticks(y0, y1, 6)) { ctx.moveTo(L, Y(t)); ctx.lineTo(L + pw, Y(t)); ctx.fillText(label(t), L - 4, Y(t) + 4); }
  ctx.stroke();
  ctx.strokeStyle = "#000"; ctx.strokeRect(L, T, pw, ph);
  ctx.textAlign = "center"; ctx.fillText(s.xLabel, L + pw / 2, H - 6);
  ctx.save(); ctx.translate(12, T + ph / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(s.yLabel, 0, 0); ctx.restore();

  ctx.save(); ctx.beginPath(); ctx.rect(L, T, pw, ph); ctx.clip();
  ctx.beginPath(); ctx.lineWidth = 1;
  for (let i = 0; i < s.x.length; i++) { const px = X(s.x[i]), py = Y(s.y[i]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.stroke(); ctx.restore();

  if (mouse && mouse.x > L && mouse.x < L + pw) {     // readout of the nearest point
    const xv = x0 + (mouse.x - L) / pw * (x1 - x0);
    let i = 0; for (let k = 1; k < s.x.length; k++) if (Math.abs(s.x[k] - xv) < Math.abs(s.x[i] - xv)) i = k;
    ctx.beginPath(); ctx.arc(X(s.x[i]), Y(s.y[i]), 3, 0, 2 * Math.PI); ctx.stroke();
    ctx.textAlign = "left";
    ctx.fillText(`${label(s.x[i])} ${s.xLabel}, ${label(s.y[i])}`, L + 6, T + 14);
  }
}
plot.onmousemove = e => { const r = plot.getBoundingClientRect(); mouse = {x: e.clientX - r.left}; requestDraw(); };
plot.onmouseleave = () => { mouse = null; requestDraw(); };
window.onresize = () => { requestDraw(); if (tab === "experiments" && !$("expRun").hidden) drawResult(); };
for (const id of ["autoY", "yMin", "yMax", "vnaQty"]) $(id).onchange = requestDraw;

$("avgCount").onchange = async () => {
  try { await api("POST", `/api/live/${view}/average`, {count: parseInt($("avgCount").value)}); }
  catch (e) { message(e.message); }
};
$("avgRestart").onclick = () => api("POST", `/api/live/${view}/average`, {restart: true}).catch(e => message(e.message));
$("hold").onclick = async () => {
  try { await api("POST", `/api/live/${view}/hold`, {hold: $("hold").textContent === "hold"}); }
  catch (e) { message(e.message); }
};
// ---------------------------------------------------------------- save
// The server always keeps a copy under its data/. This computer gets one too: with a chosen
// folder (Chrome/Edge over HTTPS or localhost) it goes to <folder>/<label>/<file>, otherwise
// it is a normal download.
let saveDir = null;

function kv(mode, op) {       // tiny IndexedDB store; it keeps the folder handle across visits
  return new Promise((resolve, reject) => {
    const open = indexedDB.open("labserver", 1);
    open.onupgradeneeded = () => open.result.createObjectStore("kv");
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const req = op(open.result.transaction("kv", mode).objectStore("kv"));
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    };
  });
}
function showDir() {
  const can = "showDirectoryPicker" in window;
  $("dirName").textContent = saveDir ? saveDir.name + "/<label>/"
    : "downloads" + (can ? "" : window.isSecureContext ? " (folder choice needs Chrome or Edge)" : " (folder choice needs https)");
  $("pickDir").hidden = !can;
  $("clearDir").hidden = !saveDir;
}
// "sampleA/run 1" -> ["sampleA", "run 1"]; drops "." and "..", replaces characters Windows refuses
function folderParts(label) {
  return label.split(/[\\/]/).map(p => p.replace(/[<>:"|?*\x00-\x1f]/g, "-").replace(/[. ]+$/, "").trim())
    .filter(p => p && p !== "." && p !== "..");
}
async function writeToDir(dir, label, r) {
  const parts = [dir.name];
  for (const p of folderParts(label)) { dir = await dir.getDirectoryHandle(p, {create: true}); parts.push(p); }
  const data = await fetch(r.url).then(x => { if (!x.ok) throw new Error(`download ${x.status}`); return x.blob(); });
  const w = await (await dir.getFileHandle(r.file, {create: true})).createWritable();
  await w.write(data); await w.close();
  return [...parts, r.file].join("/");
}
function download(r) {
  const a = document.createElement("a");
  a.href = r.url; a.download = r.file; a.click();
}

$("pickDir").onclick = async () => {
  try {
    saveDir = await window.showDirectoryPicker({id: "labserver-save", mode: "readwrite"});
    await kv("readwrite", s => s.put(saveDir, "saveDir"));
  } catch (e) { if (e.name !== "AbortError") message("choose folder failed: " + e.message); }
  showDir();
};
$("clearDir").onclick = async () => {
  saveDir = null; showDir();
  await kv("readwrite", s => s.delete("saveDir")).catch(() => {});
};
$("save").onclick = async () => {
  const label = $("label").value, seq = frame ? frame.seq : null;   // the frame on screen now
  let dir = saveDir;
  // ask for write access now: the browser only allows the prompt right after a click
  if (dir && await dir.queryPermission({mode: "readwrite"}) !== "granted"
          && await dir.requestPermission({mode: "readwrite"}) !== "granted") {
    message("no write access to " + dir.name + ", downloading instead"); dir = null;
  }
  try {
    const r = await api("POST", `/api/live/${view}/save`, {label, note: $("note").value, seq});
    let where = r.file;
    if (dir) {
      try { where = await writeToDir(dir, label, r); }
      catch (e) { message(`could not write to ${dir.name} (${e.message}), downloading instead`); download(r); }
    } else download(r);
    $("saved").textContent = "saved " + where;
    showSnapshot(r.instruments || {});
  } catch (e) { message("save failed: " + e.message); }
};
kv("readonly", s => s.get("saveDir")).then(h => { saveDir = h || null; }).catch(() => {}).finally(showDir);

// ---------------------------------------------------------------- instrument settings (SA / VNA)
const SETTINGS = {
  spa: [
    {key: "center_hz", label: "center", unit: "GHz", scale: 1e9},
    {key: "span_hz", label: "span", unit: "MHz", scale: 1e6},
    {key: "rbw_hz", label: "RBW", unit: "kHz", scale: 1e3},
    {key: "vbw_hz", label: "VBW", unit: "kHz", scale: 1e3},
    {key: "ref_level", label: "ref level", unit: "", scale: 1},
    {key: "sweep_time_s", label: "sweep", unit: "s", scale: 1,
     title: "Sweep time. With the average detector make it long (about 1 s): each point averages only ~125 samples per second of sweep at RBW 100 kHz, and none at 10 ms or less."},
    // scale before unit: applied in this order, so a unit the SA changes with the scale is set back
    {key: "scale", label: "scale", options: ["LOG", "LIN"],
     title: "Vertical scale, separate from the unit. LIN only reads right from the ref level down to about 20 dB below it."},
    {key: "unit", label: "unit", options: ["DBM", "W"]},
    // options: value, or [value, label, other read-backs]
    {key: "detector", label: "detector",
     options: [["SAMP", "sample"], ["POS", "peak"], ["NEG", "neg peak"], ["NORM", "normal"], ["AVER", "average", "RMS"]],
     title: "Sample: one sample per point. Peak / neg peak: the largest / smallest. Normal: our E7405A reads it back as peak. Average: the mean of the samples in each point, in W or dB as the average type says (use a long sweep)."},
    {key: "average_type", label: "avg type", options: [["POW", "power (RMS)"], ["LOG", "log (video)", "VID"]],
     title: "What the average detector (and trace averaging) averages: power in W, or the dB values (Gaussian noise then reads ~2.5 dB low). The VBW filter ignores it: it averages in the vertical scale, dB on LOG (~2.5 dB low), voltage on LIN (~1 dB low)."},
  ],
  vna: [
    {key: "start_hz", label: "start", unit: "GHz", scale: 1e9},
    {key: "stop_hz", label: "stop", unit: "GHz", scale: 1e9},
    {key: "points", label: "points", unit: "", scale: 1},
    {key: "ifbw_hz", label: "IFBW", unit: "Hz", scale: 1},
    {key: "power_dbm", label: "power", unit: "dBm", scale: 1},
    {key: "sweep_type", label: "sweep", options: ["LIN", "CW"]},

    if (ctl.enableEl) ctl.enableEl.checked = !!state[ctl.enable];
    if (ctl.noteEl) ctl.noteEl.textContent = ctl.note(state);
    for (const p of ctl.params) {
      if (p.inflight || p.target !== null) continue;      // a newer value is on its way
      p.value = state[p.key]; showParam(p);

  const n = exp.saved_defaults.length;
  $("expDefNote").textContent = n ? `defaults: saved for ${n} setting(s) (${exp.saved_defaults.join(", ")}); `
    + "the settings tab can put them back to the built-in ones" : "";
}
$("expSaveDefaults").onclick = async () => {
  try {
    replaceExperiment(await api("PUT", `/api/experiments/${exp.id}/defaults`, expValues()));
    message(`${exp.title}: this form is now the default`);
  } catch (e) { message("save as defaults failed: " + e.message); }
};
$("expLoad").onclick = async () => {
  const insts = [...new Set(exp.params.filter(p => p.from_state).map(p => p.from_state[0]))];
  const failed = [];
  await Promise.all(insts.map(async inst => {
    try {
      const st = await api("GET", `/api/${inst}/state`);
      for (const p of exp.params.filter(q => q.from_state && q.from_state[0] === inst)) expSetField(p, st[p.from_state[1]]);
    } catch (e) { failed.push(`${inst} (${e.message})`); }
  }));
  if (failed.length) message("could not read " + failed.join(", "));
  expChanged();
};

async function showExperiments(id) {
  if (!experiments) {
    try { experiments = await api("GET", "/api/experiments"); }
    catch (e) { message(e.message); return; }
  }
  exp = experiments.find(x => x.id === id) || null;
  $("expList").hidden = !!exp; $("expPage").hidden = !exp;
  if (!exp) {
    $("expList").innerHTML = "";
    for (const x of experiments) {
      const a = document.createElement("a"); a.className = "exp-item"; a.href = "#experiments/" + x.id;
      const t = document.createElement("div"); t.className = "exp-title"; t.textContent = x.title;
      const d = document.createElement("div"); d.textContent = x.summary;
      const i = document.createElement("div"); i.className = "muted"; i.textContent = "uses: " + x.instruments.join(", ");
      a.append(t, d, i); $("expList").append(a);
    }
    return;
  }
  $("expTitle").textContent = exp.title;
  $("expSummary").textContent = exp.summary + "  (uses: " + exp.instruments.join(", ") + ")";
  showExpDefaults();
  $("expPlan").innerHTML = "";
  planOk = false;
  buildExpForm(expStore(exp.id));
  expPlan();
  loadJob();
}

// ---------------------------------------------------------------- experiment runs
// The server runs one experiment at a time. While it runs, the page asks for the result rows
// it hasn't seen yet once a second; the last run (also a finished one) stays viewable.
let jobView = null, jobLoading = false;
const jobRunning = j => ["starting", "running"].includes(j.status);

async function loadJob() {
  if (jobLoading) return;
  jobLoading = true;
  try {
    let j = await api("GET", `/api/jobs/current?since=${jobView ? jobView.rows.length : 0}`);
    if (!j) { jobView = null; return; }
    if (!jobView || jobView.id !== j.id) {
      if (j.since !== 0) j = await api("GET", `/api/jobs/${j.id}?since=0`);
      jobView = {id: j.id, rows: []}; resultReset();
    }
    if (j.since === jobView.rows.length) jobView.rows.push(...j.rows);
    jobView.axis = j.axis; jobView.info = j;
  } catch (e) { message(e.message); }
  finally { jobLoading = false; showJob(); }
}
function showJob() {
  const running = !!jobView && jobRunning(jobView.info);
  $("expStart").disabled = !exp || running || !planOk;
  $("expStart").title = running ? "an experiment is running" : planOk ? "" : "fix the errors first";
  $("expStop").hidden = !running;
  const mine = !!jobView && !!exp && jobView.info.experiment === exp.id;
  $("expRun").hidden = !mine;
  if (!mine) return;
  const j = jobView.info;
  $("runStatus").textContent = `${j.status}: ${j.message}  |  ${j.points_done}/${j.points_total} points, `
    + `${j.traces_done}/${j.traces_total} traces, ${fmtDuration(j.elapsed_s)}`
    + (j.eta_s !== null ? `, about ${fmtDuration(j.eta_s)} left` : "")
    + (j.notes.length ? "  |  " + j.notes.join("; ") : "");
  $("runFile").hidden = !j.url;
  if (j.url) { $("runFile").href = j.url; $("runFile").download = j.file; $("runFile").textContent = "download " + j.file; }
  $("runHtml").hidden = !j.html_url;
  if (j.html_url) { $("runHtml").href = j.html_url; $("runHtml").download = j.html_url.split("/").at(-1); }
  showResult(jobView);
}
$("expStart").onclick = async () => {
  const pl = lastPlan;
  if (!confirm(`Start ${exp.title}?\n${pl.points.length} points, about ${fmtDuration(pl.estimate_s)}.`
               + (exp.turns_on ? `\nThis turns ${exp.turns_on} on.` : ""))) return;
  try { await api("POST", `/api/experiments/${exp.id}/start`, expValues()); jobView = null; await loadJob(); }
  catch (e) { message("start failed: " + e.message); }
};
$("expStop").onclick = async () => {
  try { await api("POST", `/api/jobs/${jobView.id}/stop`); } catch (e) { message(e.message); }
  loadJob();
};
setInterval(() => { if (tab === "experiments" && exp && jobView && jobRunning(jobView.info)) loadJob(); }, 1000);

// ---------------------------------------------------------------- settings tab
// Built from /api/settings (labserver/settings.py). Edited fields are marked * and go to the
// server together on "save"; it applies them at once and keeps them in settings.local.yaml.
// Loosening a limit, or turning a safety switch on, asks first. An empty limit box is no bound.
let cfgData = null;

const cfgShow = (it, v) => v === null || v === undefined ? "" : String(+(v / it.scale).toPrecision(10));
function cfgText(it, v) {
  if (it.kind === "bool") return v ? "on" : "off";
  if (it.kind === "limit") return "[" + (v || [null, null]).map(x => x === null ? "none" : cfgShow(it, x)).join(", ") + "]";
  return v === null ? "none" : cfgShow(it, v);
}
// value in the form now, in server units; undefined if a box holds something that is not a number
function cfgRead(it) {
  if (it.kind === "bool") return it.inputs[0].checked;
  const num = el => el.validity.badInput ? undefined : el.value.trim() === "" ? null : parseFloat(el.value) * it.scale;
  const vals = it.inputs.map(num);
  if (vals.includes(undefined)) return undefined;
  return it.kind === "limit" ? vals : vals[0];
}
function cfgSame(a, b) {
  if (Array.isArray(a) && Array.isArray(b)) return cfgSame(a[0], b[0]) && cfgSame(a[1], b[1]);
  if (typeof a !== "number" || typeof b !== "number") return a === b;
  return Math.abs(a - b) <= 1e-9 * Math.max(Math.abs(a), Math.abs(b));
}
function cfgSet(it, v) {
  if (it.kind === "bool") it.inputs[0].checked = !!v;
  else if (it.kind === "limit") it.inputs.forEach((el, k) => { el.value = cfgShow(it, (v || [null, null])[k]); });
  else it.inputs[0].value = cfgShow(it, v);
}
function cfgRow(it) {
  const row = document.createElement("div"); row.className = "f"; it.row = row;
  const name = document.createElement("span"); name.className = "name"; name.textContent = it.label;
  row.append(name);
  const box = placeholder => {
    const el = document.createElement("input"); el.type = "number"; el.step = "any"; el.placeholder = placeholder;
    el.addEventListener("input", cfgChanged);
    el.onkeydown = e => { if (e.key === "Enter") cfgSave(); };
    return el;
  };
  if (it.kind === "bool") {
    const c = document.createElement("input"); c.type = "checkbox"; c.onchange = cfgChanged;
    it.inputs = [c]; row.append(c);
  } else if (it.kind === "limit") {
    it.inputs = [box("no min"), box("no max")];
    row.append(it.inputs[0], " .. ", it.inputs[1]);
  } else {
    it.inputs = [box(it.nullable ? "none" : "")];
    row.append(it.inputs[0]);
  }
  if (it.unit) row.append(" " + it.unit);
  cfgSet(it, it.value);
  if (it.overridden) {      // set in the settings tab: config.yaml says something else
    const note = document.createElement("span"); note.className = "muted";
    note.textContent = `  config.yaml: ${cfgText(it, it.config)} `;
    const b = document.createElement("button"); b.textContent = "back to config";
    b.title = "put the config.yaml value in the field (then save)";
    b.onclick = () => { cfgSet(it, it.config); cfgChanged(); };
    row.append(note, b);
  }
  if (it.help) row.append(Object.assign(document.createElement("div"), {className: "help", textContent: it.help}));
  return row;
}
function cfgChanges() {
  const changes = {}, bad = [];
  for (const it of cfgData.items) {
    const v = cfgRead(it);
    const dirty = v === undefined || !cfgSame(v, it.value);
    it.row.classList.toggle("dirty", dirty);
    if (v === undefined) bad.push(`${it.group} ${it.label}`);
    else if (dirty) changes[it.id] = v;
  }
  return {changes, bad};
}
function cfgChanged() {
  const {changes, bad} = cfgChanges(), n = Object.keys(changes).length;
  $("cfgStatus").textContent = bad.length ? "not a number: " + bad.join(", ") : n ? `${n} unsaved change(s)` : "";
}
async function cfgPost(body) {
  const r = await fetch("/api/settings", {method: "POST", headers: {"content-type": "application/json"},
                                          body: JSON.stringify(body)});
  return {ok: r.ok, status: r.status, data: await r.json().catch(() => ({}))};
}
async function cfgSave() {
  const {changes, bad} = cfgChanges();
  if (bad.length) { message("settings NOT saved, not a number: " + bad.join(", ")); return; }
  if (!Object.keys(changes).length) { $("cfgStatus").textContent = "nothing to save"; return; }
  try {
    let r = await cfgPost({changes});
    if (r.status === 409 && r.data.error === "confirm") {
      if (!confirm("This loosens:\n  " + r.data.loosened.join("\n  ") + "\n\nApply it?")) return;
      r = await cfgPost({changes, confirm: true});
    }
    if (!r.ok) throw new Error(`${r.data.error || r.status}: ${r.data.detail || ""}`);
    cfgData = r.data; await buildCfgTab();
    $("cfgStatus").textContent = `saved ${new Date().toLocaleTimeString()}: ` + (r.data.changed.join(", ") || "nothing changed");
    loadInstrumentInfo();       // the knobs clamp to the limits
  } catch (e) { message("settings NOT saved: " + e.message); }
}
async function cfgExpDefaults() {
  const fs = document.createElement("fieldset"), lg = document.createElement("legend");
  lg.textContent = "Experiment defaults"; fs.append(lg);
  fs.append(Object.assign(document.createElement("div"), {className: "shelp", textContent:
    'Saved with "save as defaults" on an experiment\'s page: what its form starts with in a browser that '
    + 'has not used it yet, and after its "defaults" button. Each browser also keeps its own last values.'}));
  try { if (!experiments) experiments = await api("GET", "/api/experiments"); }
  catch (e) { fs.append(e.message); return fs; }
  for (const x of experiments) {
    const row = document.createElement("div"); row.className = "f";
    const name = document.createElement("span"); name.className = "name"; name.textContent = x.title;
    row.append(name, x.saved_defaults.length ? `saved: ${x.saved_defaults.join(", ")} ` : "built-in");
    if (x.saved_defaults.length) {
      const b = document.createElement("button"); b.textContent = "back to built-in";
      b.onclick = async () => {
        try { replaceExperiment(await api("DELETE", `/api/experiments/${x.id}/defaults`)); await buildCfgTab(); }
        catch (e) { message(e.message); }
      };
      row.append(b);
    }
    fs.append(row);
  }
  return fs;
}
async function buildCfgTab() {
  const form = $("cfgForm"); form.innerHTML = "";
  $("cfgFile").textContent = cfgData.file ? `Changes apply at once and are kept in ${cfgData.file}, over config.yaml.`
    : "Changes apply at once but are not kept (no settings file).";
  for (const sec of cfgData.sections) {
    const items = cfgData.items.filter(it => it.section === sec.id);
    if (!items.length) continue;
    const fs = document.createElement("fieldset"), lg = document.createElement("legend");
    lg.textContent = sec.title; fs.append(lg);
    if (sec.help) fs.append(Object.assign(document.createElement("div"), {className: "shelp", textContent: sec.help}));
    let group = null;
    for (const it of items) {
      if (it.group !== group) {
        group = it.group;
        fs.append(Object.assign(document.createElement("div"), {className: "group", textContent: group}));
      }
      fs.append(cfgRow(it));
    }
    form.append(fs);
  }
  form.append(await cfgExpDefaults());
  cfgChanged();
}
async function showSettingsTab() {
  try { cfgData = await api("GET", "/api/settings"); await buildCfgTab(); }
  catch (e) { message("settings: " + e.message); }
}
$("cfgSave").onclick = cfgSave;
$("cfgDiscard").onclick = () => { buildCfgTab(); $("cfgStatus").textContent = "changes discarded"; };

// ---------------------------------------------------------------- tabs
// #instruments (default), #experiments, #experiments/<id>, #settings. The live view runs only
// on the instruments tab, so the SA/VNA are not read for nothing while an experiment is set up.
let tab = null;
function route() {
  const [name, sub] = location.hash.replace(/^#/, "").split("/");
  const next = ["experiments", "settings"].includes(name) ? name : "instruments";
  for (const a of document.querySelectorAll("#tabs a")) a.classList.toggle("on", a.dataset.tab === next);
  for (const t of ["instruments", "experiments", "settings"]) $("tab-" + t).hidden = next !== t;
  if (next !== tab) {
    tab = next;
    if (tab === "instruments") { if (!serverStopped) connectLive(view); requestDraw(); } else disconnectLive();
    if (tab === "settings") showSettingsTab();
  }
  if (tab === "experiments") showExperiments(sub);
}
window.addEventListener("hashchange", route);

// ---------------------------------------------------------------- start
async function loadInstrumentInfo() {
  try {
    const info = await api("GET", "/api/instruments");
    for (const [name, v] of Object.entries(info)) limits[name] = v.limits || {};
    switchSpecs = (info.warm_switches || {}).switches || {};
  } catch (e) { message(e.message); }
}
(async () => {
  resultInit($("resultView"));
  await loadInstrumentInfo();
  buildControls();
  buildSwitches();
  document.querySelector("input[name=view][value=spa]").checked = true;   // the browser may restore another choice
  view = "spa"; buildSettings(); route();     // route() starts the live view on the instruments tab; refreshAll reads the settings
  refreshStatus(); refreshAll();
  setInterval(refreshStatus, 2000);       // server-side flags only, no instrument I/O
})();
</script>
</body>
